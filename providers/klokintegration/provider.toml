# Cache (chat): plain passthrough — OpenAI-shape chat with no documented cache behavior.
# Cache headers: none — Use no cache headers.
# Cache body: none — Use no body key field; no cache params are documented.
# Cache policy: flat per-token pricing has no cached rate, so keep prefixes stable but expect no discount.
# Docs: https://klokintegration.se/docs/ai-api
name = "klokintegration.se"
npm = "@ai-sdk/openai-compatible"
env = ["KLOKINTEGRATION_API_KEY"]
api = "https://api-gw.klok.ipaas.se/proxy/kloker-key/v1"
doc = "https://klokintegration.se/docs/ai-api"
