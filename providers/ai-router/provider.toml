# Prompt caching (chat): AI API Gateway forwards POST /v1 chat body from https://api.ai-router.dev/v1 to the upstream model; cache is the upstream automatic prefix cache.
# Use headers: none.
# Use body: none — gateway docs list no cache header or body field for chat.
# To get a hit: reuse the same model with an identical stable prefix and unchanged tools/order; retry the identical prefix and confirm via the response usage block where reported.
# Docs: https://ai-router.dev/openai-compatible-api-gateway/
name = "AI-ROUTER"
env = ["AI_ROUTER_API_KEY"]
npm = "@ai-sdk/openai-compatible"
doc = "https://ai-router.dev/openai-compatible-api-gateway/"
api = "https://api.ai-router.dev/v1"
