# Cache key (chat): strip prompt_cache_key — API ref request-body table is closed (model/messages/temperature/max_tokens/stream/top_p/n/stop/tools/tool_choice); usage reports prompt/completion/total tokens only.
# Cache headers: none
# Cache policy: no documented prompt cache; identical-prefix retries rely on upstream implicit caching only.
# Docs: https://docs.inceptron.io/API%20Reference/chat-completions
name = "Inceptron"
npm = "@ai-sdk/openai-compatible"
env = ["INCEPTRON_API_KEY"]
# Per-model reasoning controls are synchronized from the public model catalog.
api = "https://api.inceptron.io/v1"
doc = "https://docs.inceptron.io"
