# Use headers: none
# Use body: `prompt_cache_key` — OpenAPI schema documents top-level `prompt_cache_key` (session/task id; required for Kimi Code Plan, recommended for multi-turn); hits surface in usage.cached_tokens.
# Auto cache: key-assisted cache, not billing-only.
# Steps: one stable session/task id per conversation, same value on resume; fixed large context first in messages.
# Docs: https://platform.moonshot.cn/docs/api/chat
name = "Moonshot AI (China)"
env = ["MOONSHOT_API_KEY"]
npm = "@ai-sdk/openai-compatible"
# Chat is POST `/v1/chat/completions`. Kimi K2.5 and K2.6 toggle reasoning with
# `thinking.type = "enabled"|"disabled"` (enabled by default); K2.7 Code only
# accepts `"enabled"`, so it is always on. No effort or token budget is exposed.
# https://platform.kimi.com/docs/api/chat (accessed 2026-06-25)
doc = "https://platform.moonshot.cn/docs/api/chat"
api = "https://api.moonshot.cn/v1"
