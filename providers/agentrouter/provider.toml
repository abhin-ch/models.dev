# Prompt caching (chat): proxy forwards POST /v1 chat body to the upstream model endpoint; cache is the upstream automatic prefix cache.
# Use headers: none.
# Use body: none — client-setup docs define no cache header or body field for chat.
# To get a hit: reuse the same model with an identical stable prefix and unchanged tools/order; retry the identical prefix and confirm via the response usage block where reported.
# Docs: https://agentrouter.org/docs/
name = "AgentRouter"
env = ["AGENTROUTER_API_KEY"]
npm = "@ai-sdk/openai-compatible"
api = "https://agentrouter.org/v1"
doc = "https://agentrouter.org/docs/opencode.html"
