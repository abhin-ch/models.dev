# Prompt cache (chat): no documented cache behavior.
# Use body: none — request docs list no cache field for POST /v1/chat/completions.
# Use headers: none.
# Steps: no documented path to a cache hit; the API exposes no prefix-cache behavior.
# Docs: https://dinference.com/docs
name = "DInference"
env = ["DINFERENCE_API_KEY"]
npm = "@ai-sdk/openai-compatible"
# Raw HTTP is POST `/v1/chat/completions`. The published request documentation
# lists no reasoning toggle, effort, or token-budget field.
# https://dinference.com/docs (accessed 2026-06-25)
doc = "https://dinference.com"
api = "https://api.dinference.com/v1"
