# Cache key (chat): Use body `cache_control` — orchestration API (custom AI SDK provider, not OpenAI chat completions); `prompt_cache_key` is undocumented.
# Cache headers: none
# Cache body: `cache_control`
# Cache policy: explicit ephemeral `cache_control` breakpoints via orchestration prompt-templating config; implicit caching for OpenAI/Gemini-backed models.
# Docs: https://help.sap.com/docs/sap-ai-core/generative-ai/prompt-caching
name = "SAP AI Core"
env = ["AICORE_SERVICE_KEY"]
npm = "@jerome-benoit/sap-ai-provider-v2"
# Raw orchestration v2 nests routed controls at $.config.modules.prompt_templating.model.params.<field>; for example, reasoning_effort stays under params rather than at request root. https://help.sap.com/docs/sap-ai-core/sap-ai-core-service-guide/orchestration-workflow-v2 (accessed 2026-06-25)
doc = "https://help.sap.com/docs/sap-ai-core"
