# Prompt caching (chat): RouteLLM gateway forwards POST /v1/chat/completions body to the routed model; cache is the routed-model automatic prefix cache.
# Use headers: none.
# Use body: none — API reference defines no cache header or body field for chat.
# To get a hit: reuse the same routed model with an identical stable prefix and unchanged tools/order; retry the identical prefix and confirm via the response usage block where reported.
# Docs: https://abacus.ai/help/api
name = "Abacus"
npm = "@ai-sdk/openai-compatible"
# Reasoning HTTP format (accessed 2026-06-25):
# Audited POST https://routellm.abacus.ai/v1/chat/completions. The provider API
# reference documents no reasoning toggle, effort, or numeric budget request
# field. Do not infer behavior from the routed model developer's API.
# Sources:
# https://abacus.ai/help/api
env = ["ABACUS_API_KEY"]
doc = "https://abacus.ai/help/api"
api = "https://routellm.abacus.ai/v1"
