# Cache key (chat): none — shared-models page lists only POST /chat/completions with no cache-key param.
# Use headers: none
# Use body: none
# Cache policy: no client cache control; keep system prompt and leading messages byte-identical, append new content at the end, avoid reordering or mid-prefix edits.
# Docs: https://docs.stackit.cloud/products/data-and-ai/ai-model-serving/basics/available-shared-models
name = "STACKIT"
env = ["STACKIT_API_KEY"]
npm = "@ai-sdk/openai-compatible"
# Reasoning HTTP format (accessed 2026-06-25):
# POST /v1/chat/completions is documented for GPT-OSS, but STACKIT does not
# document a caller reasoning toggle, effort field, token budget, or bounds.
# Source:
# https://docs.stackit.cloud/products/data-and-ai/ai-model-serving/basics/available-shared-models
doc = "https://docs.stackit.cloud/products/data-and-ai/ai-model-serving/basics/available-shared-models"
api = "https://api.openai-compat.model-serving.eu01.onstackit.cloud/v1"
