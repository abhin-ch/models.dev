# Cache key (chat): Use headers/body none — `prompt_cache_key` absent from supported chat params; discounted cached-input billing is a billing fact only.
# Cache headers: none
# Cache body: none
# Cache policy: auto — Serverless persists prefix cache automatically via heuristics (50–90% hit for recurring prefixes, discounted cached-input billing, monitor in Cockpit); Dedicated includes its input cache; keep stable prefix first.
# Docs: https://www.scaleway.com/en/docs/generative-apis/faq/
name = "Scaleway"
npm = "@ai-sdk/openai-compatible"
api = "https://api.scaleway.ai/v1"
env = ["SCALEWAY_API_KEY"]
# Reasoning HTTP format (accessed 2026-06-25):
# POST /v1/chat/completions uses top-level reasoning_effort; supported values
# vary by model. Omission enables reasoning. "none" disables it for most
# reasoning models, but not gpt-oss-120b. Legacy deepseek-r1-distill-llama-70b
# has no reasoning_effort and emits reasoning inside content <think> tags.
# Source:
# https://www.scaleway.com/en/docs/generative-apis/how-to/query-reasoning-models/
doc = "https://www.scaleway.com/en/docs/generative-apis/"