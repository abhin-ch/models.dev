# Prompt caching (chat): No documented prompt-caching request control; responses report backend-side reuse via usage cached_tokens and cache_write_tokens.
# Use headers: none.
# Use body: none. ChatCompletionRequest omits `prompt_cache_key` and allows additional properties, so unknown fields have no documented cache effect.
# To get a hit: Keep stable shared prefixes append-only on the same model; confirm via usage cached_tokens.
# Docs: https://api.berget.ai/openapi.json
name = "Berget.AI"
env = ["BERGET_API_KEY"]
npm = "@ai-sdk/openai-compatible"
# Raw HTTP reasoning controls (source accessed 2026-06-25):
# POST https://api.berget.ai/v1/chat/completions accepts top-level
# reasoning_effort = "none" | "low" | "medium" | "high". For Kimi K2.6 it
# also accepts thinking.type = "disabled" | "enabled" | "adaptive" and maps
# effort "none" to disabled. No reasoning-token budget field is documented.
# Schema acceptance is broader than the meaningful per-model subsets below.
# https://api.berget.ai/openapi.json
api = "https://api.berget.ai/v1"
doc = "https://api.berget.ai"