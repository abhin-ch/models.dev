# Cache support: none on chat; strict schema with no cache fields, usage is completion / prompt / total only.
# Use body: omit `prompt_cache_key` on chat.
# Use headers: none.
# To get a hit: no client control; the provider returns 422 Validation Error on extra chat fields, so keep payload to documented fields.
# Docs: https://api.vultrinference.com/
name = "Vultr"
# POST /v1/chat/completions documents no reasoning request field or control.
# Responses may contain choices[].message.reasoning; a -normalize model suffix
# maps upstream reasoning_content to reasoning but does not control reasoning.
# https://api.vultrinference.com/ (accessed 2026-06-25)
npm = "@ai-sdk/openai-compatible"
api = "https://api.vultrinference.com/v1"
env = ["VULTR_API_KEY"]
doc = "https://api.vultrinference.com/"
