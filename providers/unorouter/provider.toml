# Cache support: none on chat; automatic upstream prefix reuse across 50+ routes.
# Use body: omit `prompt_cache_key`; quickstart documents only model + messages.
# Use headers: none.
# To get a hit: keep shared prefix stable with identical model + route for upstream reuse.
# Docs: https://unorouter.com/en/docs/platform/quickstart
name = "UnoRouter"
env = ["UNOROUTER_API_KEY"]
npm = "@ai-sdk/openai-compatible"
api = "https://api.unorouter.com/v1"
doc = "https://unorouter.com/models"
