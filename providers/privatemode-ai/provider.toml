# Cache key (chat): use body field cache_salt (via extra_body); same salt shares a cache; request value overrides proxy; prompt_cache_key is consumed at the gateway and removed before upstream.
# Cache headers: none — cache control is the request body field, not a header.
# Cache policy: inactive by default; enable per proxy or per request; keep salts private with >=256-bit entropy.
# Cache reuse: reuse one salt per shared context; retain full history with a stable prefix.
# Docs: https://docs.privatemode.ai/api/prompt-caching/
name = "Privatemode AI"
env = ["PRIVATEMODE_API_KEY", "PRIVATEMODE_ENDPOINT"]
npm = "@ai-sdk/openai-compatible"
# Raw HTTP reasoning caveat (source accessed 2026-06-25): POST
# `/v1/chat/completions` is served by the local Privatemode proxy. Additional
# OpenAI-style request parameters are passed through according to the active
# model server's capabilities; Privatemode defines no provider-wide reasoning
# enum or bounds. Thus gpt-oss `reasoning_effort` is model-server behavior.
# https://docs.privatemode.ai/api/chat-completions/#request-body
api = "http://localhost:8080/v1"
doc= "https://docs.privatemode.ai/api/overview"
