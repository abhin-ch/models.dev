# Cache key (chat): Use headers/body none — supported-parameter table is closed (10 params, no cache fields); unknown body fields return 400, docs direct users to contact support to add params.
# Cache headers: none (x-inference-* headers are routing/metadata, not cache)
# Cache policy: no documented prompt cache; replay requests with a stable byte-identical prefix on the same model.
# Cache verify: no cached-token usage field documented — treat as uncached.
# Docs: https://docs.inference.net/api/api-quickstart
name = "Inference"
env = ["INFERENCE_API_KEY"]
npm = "@ai-sdk/openai-compatible"
# Reasoning HTTP format (accessed 2026-06-25): POST /v1/chat/completions. The
# provider's supported-parameter table documents no toggle, effort, or numeric
# reasoning-token budget field; it directs users to request unlisted fields.
# https://docs.inference.net/api/api-quickstart
api = "https://inference.net/v1"
doc = "https://inference.net/models"
