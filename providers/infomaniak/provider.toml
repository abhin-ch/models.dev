# Cache key (chat): strip prompt_cache_key — OpenAPI chat schemas on both /1/ and /2/ paths define no prompt_cache_key/cache_control (only a mirrored OpenAI description mention under user).
# Cache headers: none
# Cache policy: automatic server-side prefix caching; verify hits via usage.prompt_tokens_details.cached_tokens.
# Docs: https://developer.infomaniak.com/docs/api/post/2/ai/%7Bproduct_id%7D/openai/v1/chat/completions
name = "Infomaniak"
npm = "@ai-sdk/openai-compatible"
api = "https://api.infomaniak.com/2/ai/${INFOMANIAK_PRODUCT_ID}/openai/v1"
env = ["INFOMANIAK_API_KEY", "INFOMANIAK_PRODUCT_ID"]
doc = "https://www.infomaniak.com/en/hosting/ai-services/open-source-models"